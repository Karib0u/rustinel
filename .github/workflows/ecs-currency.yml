name: ECS Currency

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-version:
    name: Latest stable ECS release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare target with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$(sed -n 's/^const ECS_VERSION: &str = "\([^"]*\)";/\1/p' src/models/ecs/mod.rs)"
          test -n "$target" || { echo "Could not read ECS_VERSION" >&2; exit 1; }

          latest="$(gh api repos/elastic/ecs/releases/latest --jq '.tag_name')"
          latest="${latest#v}"
          if [ "$target" != "$latest" ]; then
            echo "Rustinel targets ECS $target, but the latest stable release is ECS $latest." >&2
            echo "Review the upstream release notes and emitted fields before updating ECS_VERSION." >&2
            exit 1
          fi
