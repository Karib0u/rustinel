name: Nix

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check --no-build

      - name: Build package (native x86_64)
        run: nix build .#rustinel --print-out-paths

      - name: Verify aarch64 source archive (fetch + SRI hash check)
        # Fetches the aarch64 release archive using the local stdenv's
        # fetchurl (no QEMU/emulation needed) and verifies its SRI hash.
        # fetchurl only needs bash + curl, so it builds on an x86_64 runner
        # even though the archive targets aarch64. A broken URL or a stale
        # hash fails CI.
        run: nix build .#rustinel-aarch64-src --print-out-paths

      - name: Verify binary
        run: nix run .#rustinel -- --version
