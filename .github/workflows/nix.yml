name: Nix

on:
  push:
    branches: [master, main]
    paths:
      - flake.*
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  pull_request:
    branches: [master, main]
    paths:
      - flake.*
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # `nix flake check` (no --no-build) builds the checks output, which
      # builds the native package, fetches + verifies the aarch64 release
      # archive's SRI hash using the local stdenv's fetchurl (no QEMU), and
      # runs a --version smoke test. A single step covers everything; no Rust
      # change can affect the flake (paths filter scopes this workflow to
      # flake.* / nix/** / this file).
      - name: Check flake
        run: nix flake check
