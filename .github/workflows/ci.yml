name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      skip_atomics:
        description: Skip source-built atomic tests when release artifacts will be tested
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Update this commit deliberately when the rules repository's atomic suite changes.
  RUSTINEL_RULES_REF: 8732a0f02e88a1a67d011543cd25ed8c464d7d33

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - name: Check formatting
        run: cargo fmt --all -- --check

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny
      - name: Check root dependencies
        run: cargo deny --locked check
      - name: Check eBPF dependencies
        run: cargo deny --locked --manifest-path ebpf/Cargo.toml --config ebpf/deny.toml check

  ebpf-build:
    name: Linux eBPF Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bpf-linker links against a specific LLVM, so it has to match the LLVM
      # the nightly toolchain ships. Both pins move together — bumping one
      # without the other breaks this job.
      - name: Setup nightly Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly-2026-08-11
          components: rust-src
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install bpf-linker
        run: command -v bpf-linker >/dev/null 2>&1 || cargo install bpf-linker --version 0.10.4 --locked

      - name: Build eBPF object
        run: |
          cd ebpf
          cargo build --release
          cp target/bpfel-unknown-none/release/rustinel-ebpf rustinel-ebpf.o

      - name: Upload eBPF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustinel-ebpf-object
          path: ebpf/rustinel-ebpf.o
          retention-days: 1

  clippy-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    needs: ebpf-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download eBPF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-ebpf-object
          path: ebpf/
      - run: cargo clippy --locked --all-targets -- -D clippy::all

  clippy-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D clippy::all

  clippy-macos:
    name: Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D clippy::all

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    needs: ebpf-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download eBPF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-ebpf-object
          path: ebpf/
      - run: cargo test --locked --verbose

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --verbose

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --verbose

  # Bootstrap only: keep pull request failures non-blocking while the short-lived
  # process race is stabilized. Pushes to main remain blocking so the default
  # branch is only green when the atomic suite passes.
  atomic:
    name: Atomic (${{ matrix.platform }})
    if: ${{ !inputs.skip_atomics }}
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.os }}
    needs: ebpf-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download eBPF artifact
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustinel-ebpf-object
          path: ebpf/

      - name: Build PR binary
        run: cargo build --locked --release

      - name: Check out pinned rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Karib0u/rustinel-rules
          ref: ${{ env.RUSTINEL_RULES_REF }}
          path: rustinel-rules
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build pinned rules pack
        working-directory: rustinel-rules
        run: |
          uv sync --frozen
          # Validate a rules commit, not the enclosing engine release tag.
          uv run python -c "import os, subprocess, sys; os.environ.pop('GITHUB_REF_TYPE', None); sys.exit(subprocess.call([sys.executable, 'tools/validate.py']))"
          uv run python tools/build_packs.py

      - name: Check atomic coverage metadata
        working-directory: rustinel-rules
        run: python tests/atomic/run_atomics.py --check-coverage --strict-essential

      - name: Exclude workspace from Defender (Windows, for EICAR)
        if: matrix.platform == 'windows'
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Run atomic tests (Linux)
        if: matrix.platform == 'linux'
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform linux \
            --engine-bin "$GITHUB_WORKSPACE/target/release/rustinel" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto
        shell: bash

      - name: Run atomic tests (Windows)
        if: matrix.platform == 'windows'
        working-directory: rustinel-rules
        run: |
          # Keep fixture executables inside the workspace's Defender exclusion.
          $atomicTemp = Join-Path $env:GITHUB_WORKSPACE "atomic-temp"
          New-Item -ItemType Directory -Path $atomicTemp -Force | Out-Null
          $env:TEMP = $atomicTemp
          $env:TMP = $atomicTemp
          python tests\atomic\run_atomics.py `
            --platform windows `
            --engine-bin "$env:GITHUB_WORKSPACE\target\release\rustinel.exe" `
            --engine-dir "$env:GITHUB_WORKSPACE\rustinel-rules\tests\atomic\.engine" `
            --rules-dir "$env:GITHUB_WORKSPACE\rustinel-rules" `
            --pack auto
        shell: pwsh

      - name: Prepare atomic logs for upload (Unix)
        if: always() && matrix.platform != 'windows'
        run: |
          if [ -d rustinel-rules/tests/atomic/.engine/logs ]; then
            sudo chown -R "$(id -u):$(id -g)" rustinel-rules/tests/atomic/.engine/logs
          fi
        shell: bash

      - name: Upload atomic report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atomic-${{ matrix.platform }}
          path: |
            rustinel-rules/tests/atomic/report-*.json
            rustinel-rules/tests/atomic/.engine/engine.stdout.log
            rustinel-rules/tests/atomic/.engine/logs/
          include-hidden-files: true
          if-no-files-found: warn

  atomic-macos:
    name: Atomic (macOS)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.skip_atomics }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""

      - name: Build main binary
        run: cargo build --locked --release

      - name: Import signing identity
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          : "${SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required}"
          : "${CERT_P12_BASE64:?MACOS_CERT_P12_BASE64 is required}"
          : "${CERT_PASSWORD:?MACOS_CERT_PASSWORD is required}"
          KEYCHAIN="$RUNNER_TEMP/rustinel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build signed app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${PROVISION_PROFILE_BASE64:?MACOS_PROVISIONING_PROFILE_BASE64 is required}"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/rustinel.provisionprofile"
          scripts/macos/package-app.sh \
            --binary target/release/rustinel \
            --output "$RUNNER_TEMP/Rustinel.app" \
            --profile "$RUNNER_TEMP/rustinel.provisionprofile" \
            --identity "$SIGN_IDENTITY"

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/rustinel.provisionprofile"
          security delete-keychain "$RUNNER_TEMP/rustinel-signing.keychain-db" 2>/dev/null || true

      - name: Check out pinned rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Karib0u/rustinel-rules
          ref: ${{ env.RUSTINEL_RULES_REF }}
          path: rustinel-rules
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build pinned rules pack
        working-directory: rustinel-rules
        run: |
          uv sync --frozen
          # Validate a rules commit, not the enclosing engine release tag.
          uv run python -c "import os, subprocess, sys; os.environ.pop('GITHUB_REF_TYPE', None); sys.exit(subprocess.call([sys.executable, 'tools/validate.py']))"
          uv run python tools/build_packs.py

      - name: Check atomic coverage metadata
        working-directory: rustinel-rules
        run: python tests/atomic/run_atomics.py --check-coverage --strict-essential

      - name: Run atomic tests
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform macos \
            --engine-bin "$RUNNER_TEMP/Rustinel.app/Contents/MacOS/rustinel" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto

      - name: Prepare atomic logs for upload
        if: always()
        run: |
          if [ -d rustinel-rules/tests/atomic/.engine/logs ]; then
            sudo chown -R "$(id -u):$(id -g)" rustinel-rules/tests/atomic/.engine/logs
          fi

      - name: Upload atomic report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atomic-macos
          path: |
            rustinel-rules/tests/atomic/report-*.json
            rustinel-rules/tests/atomic/.engine/engine.stdout.log
            rustinel-rules/tests/atomic/.engine/logs/
          include-hidden-files: true
          if-no-files-found: warn
