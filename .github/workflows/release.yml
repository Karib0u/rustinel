name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Gates
    uses: $/.github/workflows/ci.yml
    with:
      skip_atomics: true
    permissions:
      contents: read

  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Download eBPF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-ebpf-object
          path: ebpf/

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustinel-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/rustinel
          retention-days: 1

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Download eBPF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-ebpf-object
          path: ebpf/

      - name: Install cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross

      - name: Build
        env:
          # cross 0.2.5 traces its linker wrapper to stderr, which rustc 1.98
          # reports through the linker_messages lint even when linking succeeds.
          RUSTFLAGS: -A linker-messages
        run: cross build --locked --release --target aarch64-unknown-linux-musl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustinel-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rustinel
          retention-days: 1

  # Windows and macOS need nothing from the CI gates (the Linux builds take
  # the gates' eBPF object), so they start at once and overlap the gates.
  # Publish still needs ci, so nothing ships unless the gates pass.
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - run: cargo build --locked --release

      - name: Verify binary
        run: |
          if (!(Test-Path target/release/rustinel.exe)) {
            Write-Error "Binary not found"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item target/release/rustinel.exe).Length / 1MB, 2)
          Write-Output "Binary: target/release/rustinel.exe ($sizeMB MB)"
          $bytes = [IO.File]::ReadAllBytes("target/release/rustinel.exe")
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            Write-Error "Binary is not a valid DOS executable"
            exit 1
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 24 + 80 -gt $bytes.Length) {
            Write-Error "Binary has an invalid PE header offset or truncated optional header"
            exit 1
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            Write-Error "Binary is not a valid PE executable"
            exit 1
          }
          $optionalHeaderOffset = $peOffset + 24
          if ([BitConverter]::ToUInt16($bytes, $optionalHeaderOffset) -ne 0x20b) {
            Write-Error "Binary is not a 64-bit PE executable"
            exit 1
          }
          # PE32+ stores SizeOfStackReserve 72 bytes into the optional header.
          $stackReserve = [BitConverter]::ToUInt64($bytes, $optionalHeaderOffset + 72)
          $expectedStackReserve = [uint64]0x1000000
          Write-Output ("SizeOfStackReserve: 0x{0:X}" -f $stackReserve)
          if ($stackReserve -ne $expectedStackReserve) {
            Write-Error ("Expected SizeOfStackReserve 0x{0:X}, got 0x{1:X}" -f $expectedStackReserve, $stackReserve)
            exit 1
          }

      # SignPath fetches this exact upload to prove which workflow built it.
      - name: Upload unsigned binary for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustinel-windows-x86_64-unsigned
          path: target/release/rustinel.exe
          retention-days: 1

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Verify Authenticode signature
        env:
          SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $sig = Get-AuthenticodeSignature signed/rustinel.exe
          Write-Output "Status: $($sig.Status)"
          Write-Output "Signer: $($sig.SignerCertificate.Subject)"
          # The SignPath test certificate chains to no trusted root, so only
          # the release policy can produce a signature Windows reports as Valid.
          if ($env:SIGNING_POLICY -eq 'test-signing') {
            if (!$sig.SignerCertificate -or $sig.Status -in 'NotSigned', 'HashMismatch') {
              Write-Error "rustinel.exe test signature is missing or broken: $($sig.StatusMessage)"
              exit 1
            }
          } elseif ($sig.Status -ne 'Valid') {
            Write-Error "rustinel.exe is not validly signed: $($sig.StatusMessage)"
            exit 1
          }
          if (!$sig.TimeStamperCertificate) {
            Write-Error "rustinel.exe signature has no timestamp"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustinel-windows-x86_64
          path: signed/rustinel.exe
          retention-days: 1

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Import signing identity
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          : "${SIGN_IDENTITY:?MACOS_SIGN_IDENTITY is required}"
          : "${CERT_P12_BASE64:?MACOS_CERT_P12_BASE64 is required}"
          : "${CERT_PASSWORD:?MACOS_CERT_PASSWORD is required}"
          KEYCHAIN="$RUNNER_TEMP/rustinel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build signed app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          TARGET: ${{ matrix.target }}
        run: |
          : "${PROVISION_PROFILE_BASE64:?MACOS_PROVISIONING_PROFILE_BASE64 is required}"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/rustinel.provisionprofile"
          scripts/macos/package-app.sh \
            --binary "target/$TARGET/release/rustinel" \
            --output "$RUNNER_TEMP/Rustinel.app" \
            --profile "$RUNNER_TEMP/rustinel.provisionprofile" \
            --identity "$SIGN_IDENTITY" \
            --version "${GITHUB_REF_NAME#v}"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          : "${NOTARY_APPLE_ID:?MACOS_NOTARY_APPLE_ID is required}"
          : "${NOTARY_TEAM_ID:?MACOS_NOTARY_TEAM_ID is required}"
          : "${NOTARY_PASSWORD:?MACOS_NOTARY_PASSWORD is required}"
          ditto -c -k --keepParent "$RUNNER_TEMP/Rustinel.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/Rustinel.app"
          xcrun stapler validate "$RUNNER_TEMP/Rustinel.app"
          spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/Rustinel.app"

      - name: Package macOS ${{ matrix.arch }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          PKG="rustinel-${GITHUB_REF_NAME#v}-${TARGET}"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/scripts/install" "$PKG/examples"
          ditto "$RUNNER_TEMP/Rustinel.app" "$PKG/Rustinel.app"
          ln -s "Rustinel.app/Contents/MacOS/rustinel" "$PKG/rustinel"
          cp config.toml README.md packaging/macos/com.rustinel.agent.plist "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustinel-macos-${{ matrix.arch }}
          path: rustinel-*-${{ matrix.target }}.tar.gz
          retention-days: 1

  atomic-release:
    name: Atomic Release (${{ matrix.label }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.runner }}
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            artifact: rustinel-linux-x86_64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            artifact: rustinel-linux-arm64
          # The Windows atomics are the long pole, so split them in two.
          - label: windows-x86_64
            runner: windows-latest
            platform: windows
            artifact: rustinel-windows-x86_64
            shard: 1/2
          - label: windows-x86_64
            runner: windows-latest
            platform: windows
            artifact: rustinel-windows-x86_64
            shard: 2/2
          - label: macos-arm64
            runner: macos-latest
            platform: macos
            artifact: rustinel-macos-arm64
          - label: macos-x86_64
            # macos-13 is retired; use the supported Intel runner.
            runner: macos-15-intel
            platform: macos
            artifact: rustinel-macos-x86_64
            experimental: true
    # Intel macOS remains optional because the hosted runner is legacy.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact/

      - name: Read shared atomic rules pin
        id: rules-pin
        shell: bash
        run: |
          ref="$(cat .github/atomic-rules-ref)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full commit SHA in .github/atomic-rules-ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Karib0u/rustinel-rules
          ref: ${{ steps.rules-pin.outputs.ref }}
          path: rustinel-rules
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build pinned rules pack
        working-directory: rustinel-rules
        run: |
          uv sync --frozen
          # Validate a rules commit, not the enclosing engine release tag.
          uv run python -c "import os, subprocess, sys; os.environ.pop('GITHUB_REF_TYPE', None); sys.exit(subprocess.call([sys.executable, 'tools/validate.py']))"
          uv run python tools/build_packs.py

      - name: Check atomic coverage metadata
        working-directory: rustinel-rules
        run: python tests/atomic/run_atomics.py --check-coverage --strict-essential

      - name: Prepare Linux artifact
        if: matrix.platform == 'linux'
        run: |
          test -f release-artifact/rustinel
          chmod +x release-artifact/rustinel
          echo "RUSTINEL_ENGINE_BIN=$GITHUB_WORKSPACE/release-artifact/rustinel" >> "$GITHUB_ENV"
        shell: bash

      - name: Prepare Windows artifact
        if: matrix.platform == 'windows'
        run: |
          if (!(Test-Path release-artifact\rustinel.exe)) {
            throw "Release executable not found"
          }
          "RUSTINEL_ENGINE_BIN=$env:GITHUB_WORKSPACE\release-artifact\rustinel.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Run native capture contract (Linux)
        if: matrix.platform == 'linux'
        run: sudo -E python3 tests/native_capture_contract.py --binary "$RUSTINEL_ENGINE_BIN"
        shell: bash

      - name: Run native capture contract (Windows)
        if: matrix.platform == 'windows' && matrix.shard == '1/2'
        run: python tests\native_capture_contract.py --binary "$env:RUSTINEL_ENGINE_BIN"
        shell: pwsh

      - name: Prepare signed macOS artifact
        if: matrix.platform == 'macos'
        run: |
          package="$(find release-artifact -type f -name '*.tar.gz' -print -quit)"
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/rustinel-package"
          tar -xzf "$package" -C "$RUNNER_TEMP/rustinel-package"
          app="$(find "$RUNNER_TEMP/rustinel-package" -type d -name Rustinel.app -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          codesign --verify --strict -R='anchor apple generic and certificate leaf[subject.OU] = "37TYDYTJ3M"' "$app"
          if codesign --verify --strict -R='anchor apple generic and certificate leaf[subject.OU] = "AAAAAAAAAA"' "$app"; then
            echo "::error::A bundle signed by another team passed identity verification"
            exit 1
          fi
          binary="$app/Contents/MacOS/rustinel"
          test -x "$binary"
          echo "RUSTINEL_ENGINE_BIN=$binary" >> "$GITHUB_ENV"
        shell: bash

      - name: Exclude workspace from Defender (Windows, for EICAR)
        if: matrix.platform == 'windows'
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Run atomic tests (Linux)
        if: matrix.platform == 'linux'
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform linux \
            --engine-bin "$RUSTINEL_ENGINE_BIN" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto
        shell: bash

      - name: Run atomic tests (Windows)
        if: matrix.platform == 'windows'
        working-directory: rustinel-rules
        run: |
          # The runner's D:\a grants Users write, and the agent refuses inputs
          # other accounts can change. The harness copies the pack into an
          # existing engine dir, so a protected one keeps the copies private.
          $engineDir = "$env:GITHUB_WORKSPACE\rustinel-rules\tests\atomic\.engine"
          New-Item -ItemType Directory -Path $engineDir -Force | Out-Null
          $runner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $engineDir /inheritance:r /grant:r "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" "*${runner}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "icacls failed on $engineDir" }
          python tests\atomic\run_atomics.py `
            --platform windows `
            --engine-bin "$env:RUSTINEL_ENGINE_BIN" `
            --engine-dir "$env:GITHUB_WORKSPACE\rustinel-rules\tests\atomic\.engine" `
            --rules-dir "$env:GITHUB_WORKSPACE\rustinel-rules" `
            --pack auto `
            --shard "${{ matrix.shard }}"
        shell: pwsh

      - name: Run atomic tests (macOS)
        if: matrix.platform == 'macos'
        working-directory: rustinel-rules
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform macos \
            --engine-bin "$RUSTINEL_ENGINE_BIN" \
            --engine-dir "$GITHUB_WORKSPACE/rustinel-rules/tests/atomic/.engine" \
            --rules-dir "$GITHUB_WORKSPACE/rustinel-rules" \
            --pack auto
        shell: bash

      - name: Prepare atomic logs for upload (Unix)
        if: always() && matrix.platform != 'windows'
        run: |
          if [ -d rustinel-rules/tests/atomic/.engine/logs ]; then
            sudo chown -R "$(id -u):$(id -g)" rustinel-rules/tests/atomic/.engine/logs
          fi
        shell: bash

      - name: Upload atomic report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomic-release-${{ matrix.label }}-${{ strategy.job-index }}
          path: |
            rustinel-rules/tests/atomic/report-*.json
            rustinel-rules/tests/atomic/.engine/engine.stdout.log
            rustinel-rules/tests/atomic/.engine/logs/
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - ci
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows
      - build-macos
      - atomic-release
    permissions:
      contents: write # create the GitHub Release and upload release assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Read release highlights
        id: highlights
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=".github/release-notes/${VERSION}.md"
          if [[ ! -s "$NOTES" ]] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Add release highlights to $NOTES in the release preparation PR."
            exit 1
          fi
          DELIMITER="release_notes_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIMITER"
            cat "$NOTES"
            printf '\n%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-linux-x86_64
          path: dist/linux-x86_64/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-linux-arm64
          path: dist/linux-arm64/

      - name: Download Windows x86_64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-windows-x86_64
          path: dist/windows-x86_64/

      - name: Download macOS arm64 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-macos-arm64
          path: dist/macos-arm64/

      - name: Download macOS x86_64 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustinel-macos-x86_64
          path: dist/macos-x86_64/

      - name: Package Linux x86_64
        run: |
          PKG="rustinel-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/scripts/install" "$PKG/examples"
          cp dist/linux-x86_64/rustinel "$PKG/"
          chmod +x "$PKG/rustinel"
          cp config.toml README.md rustinel.service "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Linux arm64
        run: |
          PKG="rustinel-${VERSION}-aarch64-unknown-linux-musl"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/scripts/install" "$PKG/examples"
          cp dist/linux-arm64/rustinel "$PKG/"
          chmod +x "$PKG/rustinel"
          cp config.toml README.md rustinel.service "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          chmod +x "$PKG/scripts/install/install.sh" "$PKG/examples/siem/splunk/send-alerts.py"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          tar czf "$PKG.tar.gz" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Windows x86_64
        run: |
          PKG="rustinel-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "$PKG/rules/sigma" "$PKG/rules/yara" "$PKG/rules/ioc" "$PKG/scripts/install" "$PKG/examples"
          cp dist/windows-x86_64/rustinel.exe "$PKG/"
          cp config.toml README.md "$PKG/"
          cp scripts/install/install.sh scripts/install/install.ps1 "$PKG/scripts/install/"
          cp -r examples/siem "$PKG/examples/"
          [[ -d rules/sigma ]] && cp -r rules/sigma/. "$PKG/rules/sigma/" || touch "$PKG/rules/sigma/.gitkeep"
          [[ -d rules/yara  ]] && cp -r rules/yara/.  "$PKG/rules/yara/"  || touch "$PKG/rules/yara/.gitkeep"
          [[ -d rules/ioc   ]] && cp -r rules/ioc/.   "$PKG/rules/ioc/"   || touch "$PKG/rules/ioc/.gitkeep"
          zip -r "$PKG.zip" "$PKG"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Check portable packages ship no output directory
        run: |
          for package in rustinel-*-unknown-linux-musl.tar.gz dist/macos-*/*.tar.gz; do
            python3 tests/portable_package_ownership.py "$package"
          done
          python3 tests/portable_package_ownership.py "rustinel-${VERSION}-x86_64-unknown-linux-musl.tar.gz" --run
          unzip -Z1 "rustinel-${VERSION}-x86_64-pc-windows-msvc.zip" | { ! grep -q '/logs'; }
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Stage macOS packages
        run: |
          cp dist/macos-arm64/*.tar.gz .
          cp dist/macos-x86_64/*.tar.gz .

      - name: Generate SHA256 checksums
        run: |
          sha256sum \
            rustinel-${VERSION}-x86_64-unknown-linux-musl.tar.gz \
            rustinel-${VERSION}-aarch64-unknown-linux-musl.tar.gz \
            rustinel-${VERSION}-x86_64-pc-windows-msvc.zip \
            rustinel-${VERSION}-aarch64-apple-darwin.tar.gz \
            rustinel-${VERSION}-x86_64-apple-darwin.tar.gz \
            > rustinel-${VERSION}-checksums-sha256.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Sign SHA256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
        run: |
          : "${RELEASE_MINISIGN_KEY:?RELEASE_MINISIGN_KEY is required}"
          sudo apt-get update
          sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$RELEASE_MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          checksum="rustinel-${VERSION}-checksums-sha256.txt"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$checksum" -x "$checksum.minisig"
          minisign -V -p release-minisign.pub -m "$checksum" -x "$checksum.minisig"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt.minisig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt
            rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt.minisig
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          name: Rustinel ${{ github.ref_name }}
          body: |
            ${{ steps.highlights.outputs.body }}

            ## Downloads

            | Platform | Architecture | Package |
            |---|---|---|
            | Linux | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz` |
            | Linux | arm64 | `rustinel-${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz` |
            | Windows | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip` |
            | macOS | arm64 | `rustinel-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz` |
            | macOS | x86_64 | `rustinel-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz` |

            ## Code signing policy

            Free code signing for the Windows binary is provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).
            See the [Code signing policy](https://docs.rustinel.io/code-signing-policy/).

            ## Installer

            **Linux and macOS**

            ```sh
            curl -fsSL https://rustinel.io/install.sh | sh -s -- --version ${{ steps.version.outputs.version }}
            cd rustinel
            sudo ./rustinel run
            ```

            macOS support is experimental. Grant Full Disk Access before the first run: https://docs.rustinel.io/macos-permissions/

            **Windows (elevated PowerShell)**

            ```powershell
            $env:RUSTINEL_VERSION='${{ steps.version.outputs.version }}'; irm https://rustinel.io/install.ps1 | iex; Remove-Item Env:\RUSTINEL_VERSION -ErrorAction SilentlyContinue
            Set-Location rustinel
            .\rustinel.exe run
            ```

            Quickstart, configuration, and SIEM guides: https://docs.rustinel.io/getting-started/

            Scripts install published release binaries only. Verify downloads with the signed `rustinel-${{ steps.version.outputs.version }}-checksums-sha256.txt` and its `.minisig` file.

            ## Provenance

            All release artifacts have [SLSA build provenance](https://slsa.dev) attestations signed by GitHub:

            ```sh
            gh attestation verify <artifact> \
              --repo Karib0u/rustinel \
              --signer-workflow Karib0u/rustinel/.github/workflows/release.yml
            ```
