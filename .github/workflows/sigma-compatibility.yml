name: SigmaHQ Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/sensor/mod.rs'
      - 'tests/sigma_corpus_compatibility.rs'
      - 'compatibility/sigmahq-baseline.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sigma-compatibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/sensor/mod.rs'
      - 'tests/sigma_corpus_compatibility.rs'
      - 'compatibility/sigmahq-baseline.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sigma-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SIGMAHQ_COMMIT: da9bb07d642a2826e89702445d32c795209ec108

jobs:
  corpus:
    name: Pinned corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SigmaHQ/sigma
          ref: ${{ env.SIGMAHQ_COMMIT }}
          path: sigmahq
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check pinned SigmaHQ compatibility
        env:
          RUSTINEL_EBPF_STUB: "1"
          RUSTINEL_SIGMA_CORPUS_DIR: ${{ github.workspace }}/sigmahq
          RUSTINEL_SIGMA_COMPAT_OUTPUT: ${{ github.workspace }}/artifacts/sigma-compatibility.json
        run: cargo test --locked --test sigma_corpus_compatibility -- --include-ignored
      - name: Upload compatibility summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigmahq-compatibility
          path: artifacts/sigma-compatibility.json
          if-no-files-found: warn
