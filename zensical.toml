# Zensical site configuration: https://zensical.org/docs/setup/basics/

[project]
site_name = "Rustinel"
site_description = "Open-source endpoint detection for Windows, Linux, and macOS using ETW, eBPF, Endpoint Security, Sigma, YARA, IOCs, and Rust"
site_author = "The Rustinel Project"
site_url = "https://docs.rustinel.io/"
repo_url = "https://github.com/Karib0u/rustinel"
# Source and edit links point at main/docs, not the default master branch.
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 The Rustinel Authors"

nav = [
    { "Home" = "index.md" },

    { "Get started" = [
        { "Installation" = "installation.md" },
        { "Quickstart" = "getting-started.md" },
        { "Deploy on an endpoint" = "operations.md" },
    ] },

    { "Guides" = [
        { "Write rules" = "rule-development.md" },
        { "Test rules with replay" = "replay.md" },
        { "Manage rule packs" = "rule-packs.md" },
        { "Forward alerts" = "siem-demos.md" },
        { "Use active response" = "active-response.md" },
        { "Upgrade" = "upgrade.md" },
    ] },

    { "Platform setup" = [
        { "Windows host logging" = "windows-logging.md" },
        { "macOS permissions" = "macos-permissions.md" },
    ] },

    { "Concepts" = [
        { "How it works" = "how-it-works.md" },
        { "Detection" = "detection.md" },
        { "Platform coverage" = "coverage.md" },
        { "Limitations" = "limitations.md" },
        { "Telemetry loss" = "telemetry-loss.md" },
        { "Security model" = "security.md" },
    ] },

    { "Reference" = [
        { "CLI" = "cli.md" },
        { "Configuration" = "configuration.md" },
        { "Alert and recording format" = "output.md" },
        { "Sigma support" = "sigma.md" },
        { "Field availability" = "field-availability.md" },
        { "Doctor checks" = "doctor.md" },
        { "telemetry.json" = "telemetry.md" },
    ] },

    { "Help" = [
        { "Troubleshooting" = "troubleshooting.md" },
        { "FAQ" = "faq.md" },
    ] },

    { "Contributing" = [
        { "Development" = "development.md" },
        { "Internals" = "architecture.md" },
        { "Benchmarking" = "benchmarking.md" },
    ] },
]

[project.theme]
# Open Graph and Twitter card meta, see overrides/main.html.
custom_dir = "overrides"
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "lucide/globe"
link = "https://rustinel.io/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Karib0u/rustinel"
